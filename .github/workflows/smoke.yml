name: Smoke

# Exercises each composite action against a trivial fixture, so the actions are tested where they live rather
# than only incidentally through consumer repositories.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  setup-texlive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Mearman/actions/.github/actions/setup-texlive@setup-texlive-v1
      - name: Compile a trivial document
        run: |
          printf '\\documentclass{article}\\begin{document}word\\end{document}\n' > smoke.tex
          latexmk -pdf -interaction=nonstopmode smoke.tex
          test -s smoke.pdf

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the rules accept a breaking change marker and reject a bad header
        run: |
          cp .github/actions/commitlint/commitlint.config.mjs .
          printf '%s\n' "feat(api)!: drop the old endpoint" | npx --yes @commitlint/cli@19
          if printf '%s\n' "not a conventional header" | npx --yes @commitlint/cli@19; then
            echo "an invalid header was accepted"
            exit 1
          fi
          if printf '%s\n' "wip!: a type outside the list" | npx --yes @commitlint/cli@19; then
            echo "an unknown type was accepted"
            exit 1
          fi
      - uses: Mearman/actions/.github/actions/commitlint@commitlint-v1
