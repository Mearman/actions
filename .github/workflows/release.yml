name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-semantic-release-v1
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Release each action
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pnpm exec semantic-release-workspace release --config semantic-release-workspace.config.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
      - name: Float each action's major version tag
        run: |
          git fetch --tags origin
          for name in setup-texlive commitlint; do
            latest=$(git tag --list "${name}-v[0-9]*" --sort=-v:refname | head -1)
            if [ -z "$latest" ]; then
              echo "no release for ${name} yet"
              continue
            fi
            major=$(printf '%s' "$latest" | grep -oE "^${name}-v[0-9]+")
            echo "floating ${major} -> ${latest}"
            git tag -f "$major" "$latest"
            git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$major"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
