name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-semantic-release-v1
      - name: Install release plugins
        run: >-
          npm install --no-save --no-package-lock
          @semantic-release/changelog@6 @semantic-release/git@10
      - name: Release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npx --yes semantic-release@24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
      - name: Float the major version tag
        run: |
          git fetch --tags origin
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            echo "no semver release yet; nothing to float"
            exit 0
          fi
          major="${latest%%.*}"
          echo "floating ${major} -> ${latest}"
          git tag -f "$major" "$latest"
          git push -q -f origin "$major"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
